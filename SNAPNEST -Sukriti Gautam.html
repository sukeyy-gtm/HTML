<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snapnest Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800">

  <!-- Navbar -->
  <header class="flex justify-between items-center px-6 py-4 shadow-md bg-white sticky top-0 z-10">
    <div class="text-red-600 font-bold text-2xl">Snapnest</div>
    <div class="space-x-4">
      <a href="snapnest3.html" class="text-gray-700 hover:text-black">Login</a>
      <a href="snapnest3.html" class="bg-red-600 text-white px-4 py-2 rounded-full hover:bg-red-700">Sign Up</a>
    </div>
  </header>

  <!-- Hero -->
  <section class="bg-pink-100 text-center py-20 px-4">
    
    <h1 class="text-4xl font-bold mb-4">Find your next idea</h1>
    <p class="text-lg mb-6 text-gray-700">DIY projects, recipes, fashion tips — all in one place.</p>
    <button class="bg-red-600 text-white px-6 py-3 rounded-full hover:bg-red-700">
        <a href="SNAPNEST.html">Explore Now</a>
    </button>
  </section>

  <!-- Pin Grid -->
  <section id="pinGrid" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4 p-6 space-y-4"></section>

  <!-- Footer -->
  <footer class="text-center py-6 text-sm text-gray-500 border-t mt-8">
    © 2025 Pinterest Clone. Interactive prototype.
  </footer>

  <!-- JS for interactivity -->
  <script>
    const pins = [
      { img: "pin9.jpg" },
      {img: "pin7.jpg" },
      { img: "pin4.jpg" },
      { img: "pin5.jpg" },
    ];

    const pinGrid = document.getElementById('pinGrid');

    function renderPins(filteredPins) {
      pinGrid.innerHTML = '';
      filteredPins.forEach(pin => {
        const pinDiv = document.createElement('div');
        pinDiv.className = 'break-inside-avoid bg-white rounded-lg shadow-md overflow-hidden transform transition hover:scale-105';
        pinDiv.innerHTML = `
          <img src="${pin.img}" alt="${pin.title}" class="w-full" />
          <p class="p-3 text-sm font-medium">${pin.title}</p>
        `;
        pinGrid.appendChild(pinDiv);
      });
    }

    function filterPins() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = pins.filter(pin => pin.title.toLowerCase().includes(search));
      renderPins(filtered);
    }

    // Initial load
    renderPins(pins);
  </script>

</body>
</html>
